<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sign in | PikBot</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050b0a;color:#effff3;font:16px system-ui}main{width:min(100%,420px);padding:28px;border:1px solid #32513d;border-radius:18px;background:#0d1912}h1{margin:0;color:#8aff91}p{line-height:1.45}label{display:block;margin-top:16px}input,button{width:100%;font:inherit;padding:12px;border:1px solid #52745a;border-radius:8px}input{margin-top:6px;background:#050b0a;color:white}button{margin-top:12px;background:#8aff91;color:#07100a;font-weight:700;cursor:pointer}a.signup{display:block;text-align:center;margin-top:12px;padding:12px;border:1px solid #52745a;border-radius:8px;color:#8aff91;text-decoration:none} [role=alert]{color:#ffb7ae}
.login-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 16px}.login-options a{display:flex;align-items:center;justify-content:center;min-height:58px;padding:10px;text-align:center;border:1px solid #52745a;border-radius:10px;color:#ccebd3;text-decoration:none;font-weight:700}.login-options a[aria-current=page]{background:#8aff91;color:#07100a;border-color:#8aff91}.login-options a:focus-visible{outline:3px solid #effff3;outline-offset:3px}</style>
</head>
<body><main>
<h1>PikBot</h1>
<nav class="login-options" aria-label="Choose login type">
<a href="/login"{% if not owner_mode %} aria-current="page"{% endif %}>Public login / Free trial</a>
<a href="/owner/login"{% if owner_mode %} aria-current="page"{% endif %}>Owner login</a>
</nav>
{% if owner_mode %}<p>Owner testing login</p>{% endif %}
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Email <input type="email" name="email" autocomplete="username" required maxlength="254"></label>
<label>Password <input type="password" name="password" autocomplete="{{ 'new-password' if request.args.get('signup') == '1' and not owner_mode else 'current-password' }}" required minlength="12" maxlength="128"></label>
{% if owner_mode %}
<label>Private owner code <input type="password" name="test_code" autocomplete="off" required></label>
<button name="action" value="login">Owner sign in</button>
<a class="signup" href="/login">Public login</a>
{% elif request.args.get('signup') == '1' %}
<button name="action" value="register">Create account and start free trial</button>
<a class="signup" href="/login">Back to login</a>
{% else %}
<button name="action" value="login">Log in</button>
<a class="signup" href="/login?signup=1">Create account and start free trial</a>
{% endif %}
</form>
</main></body></html>
