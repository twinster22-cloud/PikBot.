name: PikBot Python tests
on:
  push:
    branches: [main, feature/nba-live-props-feed]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile server.py engine.py sportsdata.py live_props.py
