<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sign in | PikBot Neon</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050b0a;color:#effff3;font:16px system-ui}main{width:min(100%,420px);padding:28px;border:1px solid #32513d;border-radius:18px;background:#0d1912}h1{margin:0;color:#8aff91}p{line-height:1.45}label{display:block;margin-top:16px}input,button{width:100%;font:inherit;padding:12px;border:1px solid #52745a;border-radius:8px}input{margin-top:6px;background:#050b0a;color:white}button{margin-top:12px;background:#8aff91;color:#07100a;font-weight:700;cursor:pointer}button+button{background:transparent;color:#8aff91} [role=alert]{color:#ffb7ae}
</style>
</head>
<body><main>
<h1>PikBot Neon</h1>
<p>Start with seven days of full access. No card required. After the trial, keep using the sample-data demo or subscribe for $15 USD per month.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Email <input type="email" name="email" autocomplete="username" required maxlength="254"></label>
<label>Password <input type="password" name="password" autocomplete="current-password" required minlength="12" maxlength="128"></label>
<button name="action" value="login">Sign in</button>
<button name="action" value="register">Create account and start free trial</button>
</form>
</main></body></html>
