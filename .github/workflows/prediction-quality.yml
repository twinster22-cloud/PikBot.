name: PikBot prediction regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [quality-gates-and-regression-tests]
jobs:
  prediction-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy
      - run: python -m unittest discover -s tests -v
